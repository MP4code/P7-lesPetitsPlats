<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Les petits plats</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <img src="assets/Logo.png" alt="Logo Les petits plats" class="logo">
    <h1>CHERCHEZ PARMI PLUS DE 1500 RECETTES <br>DU QUOTIDIEN,SIMPLES ET DÉLICIEUSES</h1>
        <div class="search-container">
                <input
                type="text"
                id="search-bar"
                placeholder="Rechercher une recette..."
                aria-label="Barre de recherche pour les recettes"
                minlength="3"
                >
                <button type="button" class="clear-btn" aria-label="Effacer la recherche">&times;</button>
                <img src="assets/Loop.png" alt="Icône de recherche" class="search-icon">
        </div>
</header>
<main>
<section class="filtersContainer">
<div class="filtersContent">
<div class="filters"></div>
<div class="totalRecipes"></div>
</div>
<div class="filterSelected"></div>
</section>

<section class="recipes-container"></section>
<div class="no-results-message"></div>

</main>

</body>
<script  type="module" src="index.js"></script>
<script  type="module" src="search.js"></script>
</html>
